[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowflow"
version = "0.1.0"
description = "Django enterprise knowledge base and intelligent workflow platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5,<6",
  "channels[daphne]>=4.2,<5",
  "channels-redis>=4.2,<5",
  "Django>=5.2,<5.3",
  "django-htmx>=1.23,<2",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "bleach>=6.2,<7",
  "Markdown>=3.7,<4",
  "openai>=1.76,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "PyMuPDF>=1.25,<2",
  "python-docx>=1.1,<2",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-django>=4.10,<5",
  "playwright>=1.63,<2",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
