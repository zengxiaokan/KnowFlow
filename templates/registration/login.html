{% extends "base.html" %}
{% block title %}登录 · KnowFlow{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
  <main class="auth-layout">
    <aside class="auth-visual" aria-hidden="true">
      <span class="auth-visual-mark">K</span>
    </aside>
    <section class="auth-form-panel" aria-labelledby="login-heading">
      <div class="auth-form-wrap auth-form-wrap-login">
        <a class="auth-wordmark" href="/" aria-label="KnowFlow 首页">KnowFlow</a>
        <header class="auth-heading">
          <h1 id="login-heading">欢迎回来</h1>
          <p>登录后继续管理你的知识库与工作流。</p>
        </header>
        <form method="post" class="auth-form" novalidate>
          {% csrf_token %}
          {{ form.non_field_errors }}
          <label>用户名<span class="auth-input"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"></path></svg>{{ form.username }}</span>{{ form.username.errors }}</label>
          <label>密码<span class="auth-input"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>{{ form.password }}</span>{{ form.password.errors }}</label>
          <button class="button button-primary auth-submit" type="submit">登录</button>
        </form>
        <p class="auth-switch">还没有账号？ <a href="{% url 'signup' %}">创建个人空间</a></p>
      </div>
    </section>
  </main>
{% endblock %}
